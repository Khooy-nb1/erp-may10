services:
  postgres:
    image: postgres:16-alpine
    container_name: erp_sales_crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_sales_crm_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_sales_crm_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
